<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>Login | RP Workspace</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="brand">
    <img src="assets/logo.svg" width="270" height="52" alt="RP Workspace">
  </header>
  <main class="workspace">
    <aside class="intro" aria-label="About the workspace">
      <h2>Your workspace,<br> with a clearer start.</h2>
      <p>Organize your access details in one simple, focused interface.</p>
      <img src="assets/access_illustration.svg" width="480" height="330" alt="">
    </aside>
    <section class="card" aria-labelledby="form-title">
      <h1 id="form-title">Welcome back.</h1>
      <p class="subtitle">Enter your account details.</p>
      <form id="login" method="post" aria-labelledby="form-title" novalidate>
        <noscript><p>Enable JavaScript to check this form in your browser.</p></noscript>
        <fieldset disabled>
          <legend class="sr-only">Account details. All fields are required.</legend>
          <div class="field">
            <label for="email">Email <span aria-hidden="true">*</span></label>
            <input id="email" type="email" autocomplete="username" placeholder="you@company.com" required aria-describedby="email-error">
            <p class="error" id="email-error"></p>
          </div>
          <div class="field">
            <label for="password">Password <span aria-hidden="true">*</span></label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required aria-describedby="password-error">
            <p class="error" id="password-error"></p>
          </div>
          <button type="submit">Sign in</button>
        </fieldset>
        <p class="result" role="status"></p>
      </form>
      <nav aria-label="Related pages">
        <p>New here? <a href="register.html">Create account</a></p>
        <a class="privacy-link" href="privacy.html">Privacy note</a>
      </nav>
    </section>
  </main>
  <footer>Rahul Pandey Workspace</footer>
</body>
</html>
